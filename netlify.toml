# Netlify Configuration for OmniChat
# Deploy to: https://app.netlify.com

[build]
  command = "npm install && npm run build"
  publish = "dist"

# Netlify Edge Functions
[[edge_functions]]
  path = "/api/chat"
  function = "chat"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "/.netlify/functions/chat"